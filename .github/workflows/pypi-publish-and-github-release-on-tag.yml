name: release

# Company runners are admitted before checkout or SIF execution. The release
# source must already be promoted to main; its tag, version and commit are fixed
# once, then verified again before publication. Publisher identity is unchanged.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing vX.Y.Z tag to publish'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: writer-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
env:
  SCITEX_CI_APPTAINER: ${{ vars.SCITEX_CI_APPTAINER }}
  SCITEX_CI_SIF: '~/.scitex/dev/containers/ci-cpu-sha256-aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5.sif'
  SCITEX_CI_SIF_SHA256: aa5836a6c317640d7e20f01eb79aa7385b3dca2f369b595065c50ba3dd34a7d5
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  admission:
    uses: scitex-ai/.github/.github/workflows/runner-admission.yml@8c646081e9f1352077d3d8674052cce7ec75a1b7
    with:
      runs_on: '["self-hosted","Linux","X64","scitex-org-cpu"]'

  preflight:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require confirmed organization membership
        env:
          AUTHORIZED: ${{ needs.admission.outputs.native_authorized }}
        run: test "$AUTHORIZED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the release identity and archive refusal controls
        run: python .github/ci/test_release_identity.py
      - id: identity
        name: Resolve the existing tag and promoted project version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/ci/release-identity.py resolve --tag "$RELEASE_TAG"

  test:
    # Fixed guarded shared defining callee (Infrastructure-owned):
    # writer-release-sif.yml@442f4e5dcd938c0297e36a5f07461d809f9416ff
    # (central PR #60 merged). Typed inputs per supported-caller-input-map-v1.
    # DAG + AUTHORIZATION PRESERVED: no test executes without release-identity
    # preflight + admission, same as the leaf job this replaces.
    needs: [admission, preflight]
    if: needs.admission.outputs.native_authorized == 'true'
    uses: scitex-ai/.github/.github/workflows/writer-release-sif.yml@442f4e5dcd938c0297e36a5f07461d809f9416ff
    with:
      operation: test
      source_commit: ${{ needs.preflight.outputs.commit }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  build:
    # Same fixed defining callee, operation build. Keeps the original position
    # after preflight+test and the admission gate. Artifact chain verified in
    # the defining body: operation build uploads writer-dist-<source_commit>,
    # the exact name the leaf publisher downloads (source_commit IS the
    # preflight commit); checkout is inputs.source_commit, closing the
    # github.sha divergence.
    needs: [admission, preflight, test]
    if: needs.admission.outputs.native_authorized == 'true'
    uses: scitex-ai/.github/.github/workflows/writer-release-sif.yml@442f4e5dcd938c0297e36a5f07461d809f9416ff
    with:
      operation: build
      source_commit: ${{ needs.preflight.outputs.commit }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  publish:
    needs: [admission, preflight, build]
    if: needs.admission.outputs.native_authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-writer
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Select the hosted interpreter for the owned publisher
        run: echo "PUBLISH_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: writer-dist-${{ needs.preflight.outputs.commit }}
          path: dist
      - name: Verify bytes and tag before the existing OIDC publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/ci/publish-in-sif.sh 3.12

  release:
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: writer-dist-${{ needs.preflight.outputs.commit }}
          path: dist
      - name: Verify release assets and extract notes
        env:
          RELEASE_COMMIT: ${{ needs.preflight.outputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/ci/release-identity.py verify-proof --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --revalidate
          VERSION="${RELEASE_TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create GitHub Release from the verified two assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true

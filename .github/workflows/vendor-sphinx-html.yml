name: vendor-sphinx-html

# Prepare leaf-owned offline docs for review. Protected branches are updated
# only through a normal PR; this workflow never commits or pushes source.
on:
  pull_request:
    paths:
      - ".github/workflows/vendor-sphinx-html.yml"
      - "docs/sphinx/**"
      - "scripts/build_docs.py"
      - "scripts/prepare_docs_update.py"
      - "src/scitex_writer/_sphinx_html/**"
      - "pyproject.toml"
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + docs deps
        run: pip install -e ".[docs]"

      - name: Prepare version-bound docs review artifact
        run: python scripts/prepare_docs_update.py --output "$RUNNER_TEMP/writer-docs-review"

      - name: Upload generated candidate for normal review
        uses: actions/upload-artifact@v4
        with:
          name: writer-offline-docs-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/writer-docs-review/
          if-no-files-found: error

      - name: Require the generated bundle to be committed through review
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- src/scitex_writer/_sphinx_html)" ]; then
            echo "::error::Offline docs differ from source. Review the source-bound artifact and submit bundle.patch through a normal pull request."
            exit 1
          fi

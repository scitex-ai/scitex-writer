name: sdist-wheel-import

# Catches "the SDIST drops a packaged submodule, so the wheel built FROM it
# imports fine from the source tree but ModuleNotFoundErrors on a clean
# install" — the 2.18.0–2.26.0 outage where an unanchored `exclude = ["config"]`
# stripped scitex_writer/_dataclasses/config/ from every published wheel.
#
# The companion `import-smoke` uses `pip install -e .`, which installs from the
# SOURCE TREE (where the excluded files still exist) and therefore CANNOT catch
# a broken sdist. This job builds the sdist, builds a wheel FROM that sdist, and
# imports the wheel in a CLEAN venv — the only place the exclude actually bites.
#
# Runs on the self-hosted pool (PS-169, fleet CI unification wave 2); the
# release pipeline enforces the same gate inside its SIF (build-in-sif.sh)
# so a tag can never publish a wheel that fails this check.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  sdist-wheel-import:
    name: sdist-wheel-import-on-ubuntu-py3-12
    # EXPLICIT, VERSION-CONTROLLED pool — no hidden `vars.CI_RUNS_ON` seam.
    #
    # This job previously routed through `vars.CI_RUNS_ON` with a fallback. That
    # is the trap: the repo's CI_RUNS_ON variable held the RETIRED `scitex-ci`
    # pool (all runners offline), and a SET variable silently overrides every
    # `|| '<fallback>'` in the YAML — so the job queued forever with NO red
    # signal while `scitex-org-cpu` runners sat online and idle. The variable is
    # a hidden repository-settings value: not visible in a diff, not reviewable,
    # and NOT writable by the agent token (PUT /actions/variables/CI_RUNS_ON ->
    # 404). Leaving it in the seam means a stale variable can always re-break
    # routing without anyone seeing it in code.
    #
    # So the pool is named here as an explicit literal (the org's supported pool,
    # scitex-org-cpu — the CI_RUNS_ON_DEFAULT in scitex_dev), mirrored in the
    # version-controlled .github/runner-pools.yaml SSOT, and pinned by
    # scripts/ci/validate_runner_pools.py + tests/scripts/ci/. Re-pointing the
    # pool is now a reviewed one-line change in this file, not a hidden click.
    # Deliberately NO `vars.*` reference: the validator rejects that seam for
    # these pinned workflows.
    runs-on: ["self-hosted", "Linux", "X64", "scitex-org-cpu"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist, then a wheel FROM the sdist
        run: |
          # PEP-668-safe on the self-hosted pool (uv-managed Python): build
          # tooling lives in its own venv, never the system interpreter.
          python -m venv /tmp/build-venv
          /tmp/build-venv/bin/pip install --upgrade pip build
          rm -rf dist
          # `python -m build` builds the sdist, then builds the wheel from that
          # sdist in isolation — so an sdist exclude that drops files also drops
          # them from the wheel, exactly reproducing the published-wheel bug.
          /tmp/build-venv/bin/python -m build --outdir dist
          echo "=== built artifacts ==="
          ls -l dist
      - name: Install the wheel into a clean venv and import the entrypoint
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --upgrade pip
          # Install the BUILT wheel (not `-e .`) so only what the sdist shipped
          # is importable.
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import scitex_writer.writer; print('import scitex_writer.writer OK')"
          # Guard the exact submodule the outage dropped, so a regression is
          # named rather than surfacing as a generic ImportError elsewhere.
          /tmp/clean/bin/python -c "from scitex_writer._dataclasses.config import WriterConfig; print('WriterConfig OK')"
      - name: Resolve every shipped container recipe from the installed wheel
        # The 2026-08-18 outage: `scitex-writer containers install texlive` was
        # dead for every pip-installed user because the .def recipes sat at the
        # repo root and the wheel packages src/scitex_writer only. It could not
        # be caught anywhere else — pytest-matrix installs with `pip install -e .`,
        # so its tests resolve the CHECKOUT, where the old path was valid. A
        # gate that cannot fail. This step is the only honest place to ask
        # whether the DATA shipped, because only here is the tree unavailable.
        run: |
          /tmp/clean/bin/python - <<'PY'
          from scitex_writer._cli.install import _SUB_TOOLS, _resolve_recipe
          missing = [t for t in _SUB_TOOLS if not _resolve_recipe(t).is_file()]
          if missing:
              raise SystemExit(
                  f"recipes absent from the built wheel: {missing}\n"
                  f"They are package data under "
                  f"src/scitex_writer/_cli/container_recipes/; check that "
                  f"nothing in pyproject's build config excludes them."
              )
          print(f"container recipes OK: {sorted(_SUB_TOOLS)}")
          PY
